# docker-compose.yml
#
# Storage layout:
# - mlflow.db  → Docker named volume (mlflow-server-db); always available on Docker startup,
#                no dependency on the WSL2/host filesystem being initialized.
# - artifacts  → host bind mount; set MLFLOW_ARTIFACTS_DIR in .env (or .env.local).
#
# Safe defaults: localhost-only via MLflow 3.x security middleware.
# Optional widening via .env (MLFLOW_ALLOWED_HOSTS / MLFLOW_CORS_ALLOWED_ORIGINS).
# Optional Postgres backend via profile "pg".
# Daily GC by default (MLFLOW_GC_INTERVAL_SECONDS defaults to 86400).

x-restart-policy: &restart_policy
  restart: unless-stopped

x-aws-env: &aws_env
  AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
  AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
  AWS_SESSION_TOKEN: "${AWS_SESSION_TOKEN:-}"
  AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-}"
  AWS_REGION: "${AWS_REGION:-}"
  AWS_PROFILE: "${AWS_PROFILE:-}"
  AWS_CONFIG_FILE: "${AWS_CONFIG_FILE:-}"
  AWS_SHARED_CREDENTIALS_FILE: "${AWS_SHARED_CREDENTIALS_FILE:-}"
  AWS_CA_BUNDLE: "${AWS_CA_BUNDLE:-}"
  MLFLOW_S3_ENDPOINT_URL: "${MLFLOW_S3_ENDPOINT_URL:-}"

x-mlflow-default-env: &mlflow_default_env
  MLFLOW_BACKEND_URI: "${MLFLOW_BACKEND_URI:-sqlite:////data/db/mlflow.db?timeout=30&journal_mode=WAL}"
  MLFLOW_ARTIFACTS_DESTINATION: "${MLFLOW_ARTIFACTS_DESTINATION:-file:/data/artifacts}"
  <<: *aws_env

services:
  mlflow:
    build:
      context: .
      dockerfile: ops/Dockerfile.mlflow-gc
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - db:/data/db
      - "${MLFLOW_ARTIFACTS_DIR:-${MLFLOW_DATA_DIR:-${XDG_DATA_HOME:-${HOME}/.local/share}/mlflow-server}/artifacts}:/data/artifacts"
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    environment:
      <<: *mlflow_default_env
    entrypoint: ["mlflow"]
    command:
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - "${MLFLOW_BACKEND_URI:-sqlite:////data/db/mlflow.db?timeout=30&journal_mode=WAL}"
      - --artifacts-destination
      - "${MLFLOW_ARTIFACTS_DESTINATION:-file:/data/artifacts}"
      - --allowed-hosts
      - "${MLFLOW_ALLOWED_HOSTS:-localhost:*,127.0.0.1:*,mlflow:*}"
      - --cors-allowed-origins
      - "${MLFLOW_CORS_ALLOWED_ORIGINS:-http://localhost:5000,http://127.0.0.1:5000}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
        required: false

  postgres:
    profiles: ["pg"]
    image: postgres:16.9
    <<: *restart_policy
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-mlflow}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-mlflow}"
      POSTGRES_DB: "${POSTGRES_DB:-mlflow}"
    volumes:
      - "${POSTGRES_DATA_DIR:-${MLFLOW_DATA_DIR:-${XDG_DATA_HOME:-${HOME}/.local/share}/mlflow-server}/pgdata}:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Keep Postgres private by default
    # ports:
    #   - "5432:5432"

  mlflow-gc:
    # NOTE: container_name makes this a single-instance stack on this host
    # (you can't run a second copy in parallel without renaming).
    container_name: mlflow-gc
    build:
      context: .
      dockerfile: ops/Dockerfile.mlflow-gc
    <<: *restart_policy
    volumes:
      - db:/data/db
      - "${MLFLOW_ARTIFACTS_DIR:-${MLFLOW_DATA_DIR:-${XDG_DATA_HOME:-${HOME}/.local/share}/mlflow-server}/artifacts}:/data/artifacts"
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      <<: *mlflow_default_env
      MLFLOW_TRACKING_URI: "http://mlflow:${MLFLOW_PORT:-5000}"
      MLFLOW_GC_INTERVAL_SECONDS: "${MLFLOW_GC_INTERVAL_SECONDS:-86400}"
    entrypoint: ["/usr/local/bin/loop"]

volumes:
  db:
    name: mlflow-server-db
    # Pure Docker-managed volume for mlflow.db.
    # Stored inside Docker Desktop's own VHD — always available on container
    # startup regardless of WSL2 / host filesystem initialization state.
