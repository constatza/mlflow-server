# docker-compose.yml
#
# Storage layout:
# - mlflow.db  → host bind mount; set MLFLOW_DB_DIR in .env.local (or .env).
#                Default: $HOME/.local/share/mlflow-server/db
# - artifacts  → host bind mount; set MLFLOW_ARTIFACTS_DIR in .env.local (or .env).
#                Default: $HOME/.local/share/mlflow-server/artifacts
# Both live under the same base dir by default, so the whole thing (DB +
# artifacts) can be backed up or copied elsewhere as one unit.
# mlflow-init chowns both: if a host path doesn't exist yet, Docker
# auto-creates it as root before mlflow-init even runs.
#
# Safe defaults: localhost-only via MLflow 3.x security middleware.
# Optional widening via .env (MLFLOW_ALLOWED_HOSTS / MLFLOW_CORS_ALLOWED_ORIGINS).
# Optional Postgres backend via profile "pg".
# Daily GC by default (MLFLOW_GC_INTERVAL_SECONDS defaults to 86400).
#
# Self-healing:
# - mlflow's healthcheck actually opens the sqlite DB (MLflow's own /health route
#   is a hardcoded 200, it never touches the DB, so it can't detect a broken
#   backend store on its own).
# - Docker's restart policy only triggers on the main process exiting, never on
#   a healthcheck going "unhealthy" -- so a broken-but-still-running container
#   would otherwise sit unhealthy forever. The "autoheal" sidecar watches health
#   status via the Docker socket and force-restarts anything unhealthy.

x-restart-policy: &restart_policy
  restart: unless-stopped

x-aws-env: &aws_env
  AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
  AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
  AWS_SESSION_TOKEN: "${AWS_SESSION_TOKEN:-}"
  AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-}"
  AWS_REGION: "${AWS_REGION:-}"
  AWS_PROFILE: "${AWS_PROFILE:-}"
  AWS_CONFIG_FILE: "${AWS_CONFIG_FILE:-}"
  AWS_SHARED_CREDENTIALS_FILE: "${AWS_SHARED_CREDENTIALS_FILE:-}"
  AWS_CA_BUNDLE: "${AWS_CA_BUNDLE:-}"
  MLFLOW_S3_ENDPOINT_URL: "${MLFLOW_S3_ENDPOINT_URL:-}"

x-mlflow-default-env: &mlflow_default_env
  MLFLOW_BACKEND_URI: "${MLFLOW_BACKEND_URI:-sqlite:////data/db/mlflow.db?timeout=30&journal_mode=WAL}"
  MLFLOW_ARTIFACTS_DESTINATION: "${MLFLOW_ARTIFACTS_DESTINATION:-file:/data/artifacts}"
  <<: *aws_env

x-mlflow-runtime-user: &mlflow_runtime_user "${MLFLOW_RUN_UID:-${HOST_UID:-1000}}:${MLFLOW_RUN_GID:-${HOST_GID:-1000}}"

services:
  mlflow-init:
    image: ghcr.io/mlflow/mlflow:latest
    restart: "no"
    user: "0:0"
    volumes:
      - "${MLFLOW_DB_DIR:-${XDG_DATA_HOME:-${HOME}/.local/share}/mlflow-server/db}:/data/db"
      - "${MLFLOW_ARTIFACTS_DIR:-${XDG_DATA_HOME:-${HOME}/.local/share}/mlflow-server/artifacts}:/data/artifacts"
    environment:
      MLFLOW_RUN_UID: "${MLFLOW_RUN_UID:-${HOST_UID:-1000}}"
      MLFLOW_RUN_GID: "${MLFLOW_RUN_GID:-${HOST_GID:-1000}}"
    command:
      - sh
      - -eu
      - -c
      - |
        mkdir -p /data/db /data/artifacts
        chown -R "${MLFLOW_RUN_UID:-${HOST_UID:-1000}}:${MLFLOW_RUN_GID:-${HOST_GID:-1000}}" /data/db /data/artifacts

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    user: *mlflow_runtime_user
    restart: unless-stopped
    stop_grace_period: 30s
    labels:
      - autoheal=true
    volumes:
      - "${MLFLOW_DB_DIR:-${XDG_DATA_HOME:-${HOME}/.local/share}/mlflow-server/db}:/data/db"
      - "${MLFLOW_ARTIFACTS_DIR:-${XDG_DATA_HOME:-${HOME}/.local/share}/mlflow-server/artifacts}:/data/artifacts"
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    environment:
      <<: *mlflow_default_env
    entrypoint: ["mlflow"]
    command:
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - "${MLFLOW_BACKEND_URI:-sqlite:////data/db/mlflow.db?timeout=30&journal_mode=WAL}"
      - --artifacts-destination
      - "${MLFLOW_ARTIFACTS_DESTINATION:-file:/data/artifacts}"
      - --allowed-hosts
      - "${MLFLOW_ALLOWED_HOSTS:-localhost:*,127.0.0.1:*,mlflow:*}"
      - --cors-allowed-origins
      - "${MLFLOW_CORS_ALLOWED_ORIGINS:-http://localhost:5000,http://127.0.0.1:5000}"
    healthcheck:
      # Checks the actual sqlite backend, not just process liveness --
      # MLflow's own /health route is a hardcoded 200 regardless of DB state.
      # If you switch to the "pg" profile, point this at postgres instead.
      test: ["CMD", "python", "-c", "import sqlite3; sqlite3.connect('file:/data/db/mlflow.db?mode=rw', uri=True).execute('select 1')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      mlflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
        required: false

  postgres:
    profiles: ["pg"]
    image: postgres:18.6
    <<: *restart_policy
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-mlflow}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-mlflow}"
      POSTGRES_DB: "${POSTGRES_DB:-mlflow}"
    volumes:
      # Postgres 18+ moved PGDATA to a versioned subdir and declares its VOLUME
      # at the parent /var/lib/postgresql (was .../data on 17 and earlier).
      - "${POSTGRES_DATA_DIR:-${XDG_DATA_HOME:-${HOME}/.local/share}/mlflow-server/pgdata}:/var/lib/postgresql"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Keep Postgres private by default
    # ports:
    #   - "5432:5432"

  mlflow-gc:
    # NOTE: container_name makes this a single-instance stack on this host
    # (you can't run a second copy in parallel without renaming).
    container_name: mlflow-gc
    build:
      context: .
      dockerfile: ops/Dockerfile.mlflow-gc
    user: *mlflow_runtime_user
    <<: *restart_policy
    stop_grace_period: 30s
    volumes:
      - "${MLFLOW_DB_DIR:-${XDG_DATA_HOME:-${HOME}/.local/share}/mlflow-server/db}:/data/db"
      - "${MLFLOW_ARTIFACTS_DIR:-${XDG_DATA_HOME:-${HOME}/.local/share}/mlflow-server/artifacts}:/data/artifacts"
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      <<: *mlflow_default_env
      MLFLOW_TRACKING_URI: "http://mlflow:${MLFLOW_PORT:-5000}"
      MLFLOW_GC_INTERVAL_SECONDS: "${MLFLOW_GC_INTERVAL_SECONDS:-86400}"
    entrypoint: ["/usr/local/bin/loop"]

  autoheal:
    # Force-restarts any container labeled autoheal=true once Docker marks it
    # unhealthy. Needed because Docker's own restart policy never acts on
    # healthcheck failures, only on the process exiting.
    # NOTE: needs the Docker socket -- effectively root-on-host access for
    # this container.
    image: willfarrell/autoheal:latest
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
